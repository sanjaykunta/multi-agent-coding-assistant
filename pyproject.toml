[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-coding-assistant"
version = "0.1.0"
description = "A production-style multi-agent coding assistant with LangGraph, embedding RAG, MCP file tools, and Vertex AI Gemini support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjay Kunta" }]
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "langgraph>=1.0.0",
  "mcp>=1.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2"
]

[project.scripts]
coding-assistant = "coding_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample_workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
